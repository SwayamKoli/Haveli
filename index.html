<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120B09" />
    <script>
      /* Set the saved theme before anything is drawn, so there is no flash. Dark is the default. */
      (function () {
        var t = "dark";
        try { if (localStorage.getItem("haveli:theme") === "light") t = "light"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.setAttribute("data-bg", "none");
        var m = document.querySelector("meta[name=theme-color]");
        if (m && t === "light") m.setAttribute("content", "#F3E9DC");
      })();
    </script>
    <title>Hotel dashboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e5805a'/%3E%3Cpath d='M8 25V14l8-6 8 6v11M13 25v-6h6v6' fill='none' stroke='%232a0f06' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preload" href="/fonts/Inter-Regular.woff" as="font" type="font/woff" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
