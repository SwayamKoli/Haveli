name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
        continue-on-error: true
      - run: npm test
      - run: npm run build:demo
      # Known vulnerabilities in the packages that run on the server. Reported, not blocking: a new advisory should not stop an unrelated change.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
